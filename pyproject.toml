[project]
name = "f1-strategy-engine"
version = "0.1.0"
description = "F1 strategy engine"
readme = "README.md"
authors = [
    { name = "Lukas Brookfield" }
]
requires-python = ">=3.12"
dependencies = [
    "fastf1>=3.8.3",
    "numpy>=2.5.2",
    "pandas>=2.3.3",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
